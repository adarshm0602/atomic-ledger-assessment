[project]
name = "atomic-ledger"
version = "1.0.0"
description = "Account ledger assessment with atomic transactions and money transfers"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0"]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
